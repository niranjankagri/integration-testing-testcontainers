services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
      - tempo
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  tempo:
    image: grafana/tempo:3.1.1
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - 127.0.0.1:3200:3200
      - 127.0.0.1:4318:4318
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
