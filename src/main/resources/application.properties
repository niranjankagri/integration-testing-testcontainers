spring.application.name=orderservice

# The database and Kafka connections come from the environment, or in tests and in
# TestOrderServiceApplication from the Testcontainers containers (@ServiceConnection).

# Consumers start at the beginning of a topic the first time a group sees it, so no event published
# before the listener was ready is lost.
spring.kafka.consumer.group-id=orderservice
spring.kafka.consumer.auto-offset-reset=earliest

# GraphiQL in the browser at /graphiql when the app runs locally.
spring.graphql.graphiql.enabled=true

# Expose only liveness information and scrapeable metrics; do not expose env, config, or bean details.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
