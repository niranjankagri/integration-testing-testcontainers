spring.application.name=orderservice

# The database and Kafka connections come from the environment, or in tests and in
# TestOrderServiceApplication from the Testcontainers containers (@ServiceConnection).

# Consumers start at the beginning of a topic the first time a group sees it, so no event published
# before the listener was ready is lost.
spring.kafka.consumer.group-id=orderservice
spring.kafka.consumer.auto-offset-reset=earliest

# GraphiQL in the browser at /graphiql when the app runs locally.
spring.graphql.graphiql.enabled=true

# Expose only liveness information and scrapeable metrics; do not expose env, config, or bean details.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Send sampled traces to the local Tempo container. Override the endpoint and sampling rate per environment.
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=${TRACE_SAMPLING_PROBABILITY:0.1}

# Include Kafka producer/consumer spans and propagate trace context through message headers.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# How long a relay owns a claimed outbox event; after a crash another relay takes the event over once it expires.
orders.outbox.claim-lease-seconds=${ORDERS_OUTBOX_CLAIM_LEASE_SECONDS:30}

# Keep published outbox events for a month, then remove them in small scheduled batches.
orders.outbox.retention-days=${ORDERS_OUTBOX_RETENTION_DAYS:30}
orders.outbox.cleanup-interval-ms=${ORDERS_OUTBOX_CLEANUP_INTERVAL_MS:60000}
