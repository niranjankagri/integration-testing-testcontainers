# CI: the whole suite on every push. GitHub's Ubuntu runners have Docker, so Testcontainers starts PostgreSQL and
# Kafka exactly as on a laptop: no service containers, no test database to maintain.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Integration tests (PostgreSQL + Kafka in containers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Test results"
            echo ""
            echo "| Test class | Tests | Failures | Errors | Time |"
            echo "|---|---:|---:|---:|---:|"
            for f in target/surefire-reports/TEST-*.xml; do
              name=$(basename "$f" .xml | sed 's/^TEST-com\.niranjankagri\.orders\.//')
              line=$(grep -m1 -o '<testsuite [^>]*>' "$f")
              get() { echo "$line" | grep -o " $1=\"[^\"]*\"" | cut -d'"' -f2; }
              echo "| $name | $(get tests) | $(get failures) | $(get errors) | $(get time) s |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
