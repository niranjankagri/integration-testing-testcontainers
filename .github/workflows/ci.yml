# CI: the whole suite on every push. GitHub's Ubuntu runners have Docker, so Testcontainers starts PostgreSQL and
# Kafka exactly as on a laptop: no service containers, no test database to maintain.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a broken dependency or a change outside the repository
    # shows up within a week (night in India, before the daily Quality Intelligence collection)
    - cron: '15 23 * * 5'   # Friday 23:15 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Integration tests (PostgreSQL + Kafka in containers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      # JUnit XML only, as its own artifact: the CI results collection of
      # automation-coverage-quality-intelligence imports it (config/producers.toml there)
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Test results"
            echo ""
            echo "| Test class | Tests | Failures | Errors | Time |"
            echo "|---|---:|---:|---:|---:|"
            for f in target/surefire-reports/TEST-*.xml; do
              name=$(basename "$f" .xml | sed 's/^TEST-com\.niranjankagri\.orders\.//')
              line=$(grep -m1 -o '<testsuite [^>]*>' "$f")
              get() { echo "$line" | grep -o " $1=\"[^\"]*\"" | cut -d'"' -f2; }
              echo "| $name | $(get tests) | $(get failures) | $(get errors) | $(get time) s |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  prometheus:
    name: Prometheus configuration and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # promtool from the same image the local stack runs: checks the configuration and rules, then runs the rule
      # unit tests in observability/prometheus/tests (each alert fires when it should and stays quiet otherwise)
      - name: Check the configuration and test the alert rules
        run: |
          promtool() {
            docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v3.15.1 "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          promtool test rules /etc/prometheus/tests/order-service.test.yml

  # Consumer throughput and rebalancing (PaymentConsumerPerformanceTest): too slow for every pull request, so it runs
  # with the weekly schedule and by hand. The report goes into the job summary and is kept as an artifact.
  performance:
    name: Consumer performance (weekly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Throughput and rebalancing
        run: ./mvnw -B verify -Pperformance
      - name: Report
        if: ${{ !cancelled() }}
        run: cat target/performance/consumer-performance.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: consumer-performance
          path: target/performance
          if-no-files-found: warn
          retention-days: 30
